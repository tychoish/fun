name: ci
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**.go"
    branches:
      - main
  push:
    paths:
      - "**.go"
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: go test
        run: |
          go test -race -cover -timeout=5m ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout 8m
          github-token: ${{ secrets.github_token }}
